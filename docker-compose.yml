version: '3.8'

services:
  nginx:
    image: nginx:stable-alpine
    container_name: ems-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - ai-service
    networks:
      - ems-network

  frontend:
    build:
      context: ./frontend
    container_name: ems-frontend
    environment:
      - VITE_API_URL=/api/v1
    networks:
      - ems-network

  backend:
    build:
      context: ./backend
    container_name: ems-backend
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/ems}
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=http://localhost
    depends_on:
      - mongo
      - redis
    networks:
      - ems-network

  ai-service:
    build:
      context: ./ai-service
    container_name: ems-ai-service
    networks:
      - ems-network

  mongo:
    image: mongo:latest
    container_name: ems-mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - ems-network

  redis:
    image: redis:alpine
    container_name: ems-redis
    volumes:
      - redis_data:/data
    networks:
      - ems-network

networks:
  ems-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
